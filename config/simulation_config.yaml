# Validity checks for `snakemake simulations` (simulate_eeg.py). Each tag keeps a
# real session's montage and events and replaces only the signal. Frontal
# electrodes carry the planted effect; every other electrode should show none.

# hg_power: pink noise + 70-150 Hz noise on every channel; on target_lobes the
# 70-150 Hz part is scaled by hg_gain from onset on.
hg_null:
  data_generating_process: hg_power
  band: [70, 150]
  hg_amplitude: 10
  hg_gain: 1
  target_lobes: [frontal]
  pinknoise_amplitude: 10
  pinknoise_exponent: 1
hg_power_frontal:
  data_generating_process: hg_power
  band: [70, 150]
  hg_amplitude: 10
  hg_gain: 2
  target_lobes: [frontal]
  pinknoise_amplitude: 10
  pinknoise_exponent: 1
# hg_ppc: 110 Hz bursts (between the 100/120 Hz notches), frontal pairs
# phase-coupled after onset only. PPC must be > 0; 1e-6 ~ none.
hg_ppc_frontal:
  data_generating_process: hg_ppc
  target_lobes: [frontal]
  global_ppc: 0.01
  target_ppc0: 0.01
  target_ppc1: 0.5
  oscillation_frequency: 110
  morlet_reps: 5
  wavelet_amplitude: 100
  pinknoise_amplitude: 10
  pinknoise_exponent: 1

# Recovery sweeps (-> <figures>/simulations/recovery.png): each value becomes its
# own tag `<sweep>_<value>` with every key in `keys` set to that value.
sweeps:
  rec_power_noisy:     # amplitude gain after onset -> planted 20*log10(gain) dB
    keys: [hg_gain]
    values: [1, 1.25, 1.5, 2, 4]
    params: &rec_power
      data_generating_process: hg_power
      band: [70, 150]
      hg_amplitude: 10
      target_lobes: [frontal]
      pinknoise_amplitude: 10
      pinknoise_exponent: 1
  rec_power_clean:
    keys: [hg_gain]
    values: [1, 1.25, 1.5, 2, 4]
    params: {<<: *rec_power, pinknoise_amplitude: 0}
  rec_ppc_noisy:       # post-onset PPC among frontal pairs; ~0 before
    keys: [target_ppc1]
    values: [0.000001, 0.1, 0.25, 0.5, 0.75, 0.99]
    params: &rec_ppc
      data_generating_process: hg_ppc
      target_lobes: [frontal]
      global_ppc: 0.000001
      target_ppc0: 0.000001
      oscillation_frequency: 110
      morlet_reps: 5
      wavelet_amplitude: 100
      pinknoise_amplitude: 10
      pinknoise_exponent: 1
  rec_ppc_clean:
    keys: [target_ppc1]
    values: [0.000001, 0.1, 0.25, 0.5, 0.75, 0.99]
    params: {<<: *rec_ppc, pinknoise_amplitude: 0}
