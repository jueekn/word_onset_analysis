# Validity checks for `snakemake simulations` (simulate_eeg.py). Each tag keeps a
# real session's montage and events and replaces only the signal. Frontal
# electrodes carry the planted effect; every other electrode should show none.

# hg_power: pink noise + 70-150 Hz noise on every channel; on target_lobes the
# 70-150 Hz part is scaled by hg_gain from onset on.
hg_null:
  data_generating_process: hg_power
  band: [70, 150]
  hg_amplitude: 10
  hg_gain: 1
  target_lobes: [frontal]
  pinknoise_amplitude: 10
  pinknoise_exponent: 1
hg_null_line:          # hg_null + 60 Hz mains (tests notch ringing at the clip edges)
  data_generating_process: hg_power
  band: [70, 150]
  hg_amplitude: 10
  hg_gain: 1
  target_lobes: [frontal]
  pinknoise_amplitude: 10
  pinknoise_exponent: 1
  line_amplitude: 20
hg_power_frontal:
  data_generating_process: hg_power
  band: [70, 150]
  hg_amplitude: 10
  hg_gain: 2
  target_lobes: [frontal]
  pinknoise_amplitude: 10
  pinknoise_exponent: 1
# Synchrony checks for ciPLV (alpha) and AEC-c (high gamma); see simulate_eeg.py.
alpha_lag_frontal:     # 10 Hz, frontal pairs coupled after onset, half of them lagged pi/2
  data_generating_process: osc_lag
  target_lobes: [frontal]
  global_ppc: 0.01
  target_ppc0: 0.01
  target_ppc1: 0.5
  phase_lag: 1.5708
  oscillation_frequency: 10
  osc_amplitude: 20
  pinknoise_amplitude: 10
  pinknoise_exponent: 1
hg_env_frontal:        # 70-110 Hz carriers, shared < 4 Hz envelope among frontal channels after onset
  data_generating_process: hg_envelope
  target_lobes: [frontal]
  band: [70, 110]
  env_hz: 4
  env_depth: 0.5
  hg_amplitude: 10
  pinknoise_amplitude: 10
  pinknoise_exponent: 1
alpha_lag_epoch:       # as alpha_lag_frontal, coupled only 400-800 ms (epoch network timing)
  data_generating_process: osc_lag
  target_lobes: [frontal]
  global_ppc: 0.01
  target_ppc0: 0.01
  target_ppc1: 0.5
  phase_lag: 1.5708
  oscillation_frequency: 10
  osc_amplitude: 20
  pinknoise_amplitude: 10
  pinknoise_exponent: 1
  active_ms: [400, 800]
hg_env_epoch:          # as hg_env_frontal, shared envelope only 400-800 ms
  data_generating_process: hg_envelope
  target_lobes: [frontal]
  band: [70, 110]
  env_hz: 4
  env_depth: 0.5
  hg_amplitude: 10
  pinknoise_amplitude: 10
  pinknoise_exponent: 1
  active_ms: [400, 800]
leak_frontal:          # zero-lag common source on frontal channels after onset
  data_generating_process: leak
  target_lobes: [frontal]
  leak_gain: 1
  pinknoise_amplitude: 10
  pinknoise_exponent: 1

# Recovery sweeps (-> <figures>/simulations/recovery.png): each value becomes its
# own tag `<sweep>_<value>` with every key in `keys` set to that value.
sweeps:
  rec_power_noisy:     # amplitude gain after onset -> planted 20*log10(gain) dB
    keys: [hg_gain]
    values: [1, 1.25, 1.5, 2, 4]
    params: &rec_power
      data_generating_process: hg_power
      band: [70, 150]
      hg_amplitude: 10
      target_lobes: [frontal]
      pinknoise_amplitude: 10
      pinknoise_exponent: 1
  rec_power_clean:
    keys: [hg_gain]
    values: [1, 1.25, 1.5, 2, 4]
    params: {<<: *rec_power, pinknoise_amplitude: 0}
  rec_ciplv:           # post-onset phase consistency among frontal pairs (half lagged pi/2)
    keys: [target_ppc1]
    values: [0.01, 0.1, 0.25, 0.5, 0.75]
    params:
      data_generating_process: osc_lag
      target_lobes: [frontal]
      global_ppc: 0.01
      target_ppc0: 0.01
      phase_lag: 1.5708
      oscillation_frequency: 10
      osc_amplitude: 20
      pinknoise_amplitude: 10
      pinknoise_exponent: 1
  rec_aec_c:           # depth of the shared post-onset envelope among frontal channels
    keys: [env_depth]
    values: [0, 0.25, 0.5, 1, 2]
    params:
      data_generating_process: hg_envelope
      target_lobes: [frontal]
      band: [70, 110]
      env_hz: 4
      hg_amplitude: 10
      pinknoise_amplitude: 10
      pinknoise_exponent: 1
