# ─── AEC family ──────────────────────────────────────────────────────────────
# Gamma-AEC pipeline sims. DGP: sim/fc_aec_dgp.sample_eeg_aec — plants a
# cross-channel envelope correlation matrix (block-diagonal: global / within-
# region-group / within-region), Cholesky-mixes white noise to that target,
# low-passes to envelope_cutoff_Hz, multiplies by a gamma-band carrier.
#
# Effect-size triplets: weak / standard / strong mirror Coherence_* on
# correlation scale; extra_weak is sub-Coherence_weak at (0.01, 0.02, 0.05).
# Per code_issues #85, production AEC bandpasses to (70, 110) Hz pre-envelope;
# carrier_freq_Hz=90 sits centered in that band. sample_rate_Hz=250 matches
# helper.preprocess_eeg post-resample.
AEC_null:
  data_generating_process: aec_envelope
  global_aec0: 1.0e-06
  within_group_aec0: 1.0e-06
  within_region_aec0: 1.0e-06
  global_aec1: 1.0e-06
  within_group_aec1: 1.0e-06
  within_region_aec1: 1.0e-06
  carrier_freq_Hz: 90.0
  envelope_cutoff_Hz: 5.0
  noise_amplitude: 0.1
  phase_mode: independent
  n_channels: 60
  n_regions: 10
  n_region_groups: 2
  n_electrodes_per_region: 6
  sample_rate_Hz: 250
  duration_ms: 1000
  gc_n_lags: 1
AEC_extra_weak:
  data_generating_process: aec_envelope
  global_aec0: 0.01
  within_group_aec0: 0.02
