# Configuration for word_onset_analysis, read by project_paths.py.

# Human-readable name of this pipeline configuration. Stamped into the
# `config` column of the exclusion-count logs so multiple configs coexist.
config_name: default

# Paths. ${USER}, ${REPO_ROOT} and ${SCRATCH_DIR} (the resolved scratch_dir)
# expand; relative paths are joined with the repo root.
paths:
  # Where the per-session artifacts live: session lists, events, electrode
  # tables, FC / power pickles. Large (tens of GB for the full cohort); point it
  # at a big disk. Kept outside the repo. Smokescreen / longetal runs use
  # sibling folders (scratch.smokescreen, scratch.longetal, ...).
  scratch_dir: /Users/${USER}/scratch/word_onset_analysis/scratch
  # OpenNeuro download cache (cml_data; project_paths exports it as
  # CML_BIDS_CACHE unless that is already set). ~280 GB for FR1 monopolar.
  bids_cache: /Users/${USER}/scratch/word_onset_analysis/bids_data
  # Event/session exclusion-count logs (per-session logs aggregate here).
  exclusion_counts: results/exclusion_counts
  # Tracked tabular data files shipped with the repo (curated denylists, etc.)
  unrecoverable_sessions_csv: data/unrecoverable_sessions.csv

# Spectral bands consumed by all FC compute functions. Tuples are loaded
# as `tuple(v)` by project_paths.BANDS.
bands:
  alpha:      [8, 13]
  # PAC phase (low) and amplitude (gamma) bands; gamma's 110 Hz upper edge lets
  # MNE fit the band-pass stopband below the 250 Hz Nyquist.
  low:        [3, 8]
  gamma:      [70, 110]
  # high_gamma: the analysis band (70-150, as Long et al. on this dataset). It
  # CONTAINS the 100/120/150 Hz line harmonics, so notch_harmonics_up_to_hz must
  # stay set. Sessions below 499 Hz are excluded, so Nyquist >= 249.5 Hz.
  high_gamma: [70, 150]

# ─── Signal processing constants ──────────────────────────────────────────
# mt_bandwidth: passed to mne_connectivity.spectral_connectivity_epochs.
#   null = MNE default (~8*sfreq/n_times). Code_issues #79 recommends 2.
# real_data_buffer_ms: ms of REAL adjacent EEG loaded on each side of every
#   analysis window. Resample + notch (and PAC's band-pass + Hilbert) run on the
#   buffered window; the buffer is removed before the multitaper. 500 ms:
#   the 4 Hz-wide Butterworth notches ring for a few hundred ms, and at 50 ms
#   the in-band 100/120/150 Hz notches biased null power to d ~ -0.08
#   (hg_null simulation; ~0 at >=500 ms). Also used by build_roi_power. The
#   buffers of the two word_on windows overlap (pre ends -100, post starts 0),
#   but each is cropped before the multitaper, so only filter ringing near the
#   notch frequencies can cross between windows.
real_data_buffer_ms: 500
mt_bandwidth: 2

# Power time course (gamma only; build_roi_power TIMING_MIN_HZ).
# time_bin_ms: step between bin centres (12 bins over the 600 ms word_on window).
# mt_window_ms: sliding multitaper window centred on each bin. Neighbouring
#   windows overlap by half, so read the time course for PEAK LOCATION, not width.
#   Floor ~100 ms: shorter windows smooth wide enough (NW held at 0.6) to reach
#   the 58-62 Hz notch and let mains leak into the band.
time_bin_ms: 50
mt_window_ms: 100

# resample_hz: target rate (Hz) that helper.get_beh_eeg downsamples every loaded
#   clip to before notch filtering. 500 Hz keeps Nyquist at 250 Hz so the gamma
#   amplitude band (up to 110 Hz, bands.gamma) stays below Nyquist with margin.
#   Sessions natively below this rate are excluded upstream (see data_check).
resample_hz: 500

# min_sample_rate_hz: native sample rate (Hz) below which a session is excluded
#   from sess_list_df (include=False) in data_check. 499 keeps the ~499.7 Hz
#   BioSemi sessions while dropping genuinely sub-500 Hz recordings (most pyFR).
min_sample_rate_hz: 499

# notch_harmonics_up_to_hz: highest frequency (Hz) up to which INTEGER HARMONICS
#   of the line frequency are notched by helper.notch_filter, in addition to the
#   fundamental (50 Hz Germany / 60 Hz US) that is always removed. Each harmonic
#   gets the same +/-2 Hz stopband as the fundamental -- the convention already
#   assumed by wavelet.Wavelet.MakePlot, which plots 118-122 and 178-182.
#
#   null (default) = fundamental only = historical behaviour. Every existing
#   low-frequency result stays bit-identical; nothing needs recomputing.
#
#   Set this for any run in a band that reaches the harmonics -- notably
#   bands.high_gamma [70,150], which contains the US 2nd harmonic (120 Hz) and
#   BOTH the German 2nd and 3rd (100, 150 Hz). Set it to the band's fmax (150
#   for high_gamma) -- that notches exactly {100, 120, 150} and nothing outside
#   the band; a larger value only adds pointless filter passes at 180/200 Hz.
#   Harmonics whose stopband would reach Nyquist are skipped.
#
#   Notching is SITE-UNIFORM: helper.notch_filter removes the union of BOTH
#   mains standards' harmonics for every subject, so all subjects share one
#   effective passband (see the rationale in that function).
#
#   Leaving this null while analysing high gamma is a SILENT failure: the band
#   fills with mains, and at Freiburg sites the contamination lands exactly at
#   the 100 Hz band centre.
notch_harmonics_up_to_hz: 150

# pair_distance_threshold_mm: bipolar pairs whose inter-contact distance exceeds
#   this (mm) are dropped in data_check.check_pairs (long-range pairs reflect
#   volume conduction / poor localization). Scientific cutoff -> lives here;
#   data_check's internal QC tolerances stay as constants in data_check.py.
pair_distance_threshold_mm: 20

# computation_metrics: synchrony metrics build_roi_synchrony can compute (MNE
# multitaper phase metrics + PAC: phase of bands.low, amplitude of bands.gamma).
computation_metrics: [coh, plv, ppc, ciplv, pli, wpli, pac]

# ─── Snakefile ──────────────────────────────────────────────────────────────
# smokescreen: true -> first N subjects; scratch, exclusion logs and figures go
#   to *.smokescreen so a smoke run never feeds the full run's cache.
smokescreen: false
smokescreen_n_subjects: 3
# One entry per analysis; each gets ROI power, ROI synchrony, power-synchrony.
runs:
  - {band: alpha, metric: ppc}
  - {band: high_gamma, metric: ppc}
# `snakemake simulations`: config/simulation_config.yaml tags run through the same
# rules (EEG replaced, real montages/events kept); figures -> <figures>/simulations/<tag>.
simulations: [hg_null, hg_power_frontal, hg_ppc_frontal]

# ─── Long et al. 2020 replication (snakemake --config longetal=true) ─────────
# Everything else follows the defaults above. Outputs: scratch.longetal/,
# figures.longetal/. Power only (Long ran no synchrony).
longetal_params:
  experiments: [FR1]
  min_word_events: 300       # complete sessions only (25 lists x 12 words)
  english_only: true         # English wordpool sessions only (FR1 has 13 Spanish sessions)
  acquisition: monopolar     # + common average reference over the kept contacts
  depth_reference: car            # car | bipolar (depth leads: adjacent contacts; CAR over grids/strips only)
  atlases: [ind.region]      # Desikan-Killiany (surface) labels for every contact, as in Long
  # Unknown in Long's text; defaults = current choice, alternatives piloted:
  hg_bands: 8                   # 1: one 70-150 band-pass | 8: mean amplitude over 8 log-spaced bands
  baseline: fixed               # fixed: pre_win | full_isi: each trial's whole blank (prev word offset -> onset)
  include_incomplete_sessions: true   # true: all sessions of subjects with >=1 complete session
  include_first_word: true     # true: keep serial position 1 (follows the countdown)
  envelope_hz: 100           # Hilbert amplitude at the native rate, then -> 100 Hz
  pre_win: [-750, 0]         # blank screen (ISI is 750-1000 ms)
  post_win: [0, 1600]        # word on screen
  t_unit: sample             # responsiveness t over every envelope sample (uncorrected, as Long)
  min_responsive_per_region: 50
  exclude_lobes: [limbic, hippocampus, subcortical]   # Long excluded limbic + sublobar electrodes
  exclude_regions: [posterior cingulate gyrus]       # limbic in Long's atlas (Burke: parietal)
  combine: word_average      # average each word over sessions, then test (Long); else d_mean
  runs:
    - {band: high_gamma, metric: ppc}
  simulations: [hg_null, hg_power_frontal]
